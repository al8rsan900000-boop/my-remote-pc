name: Windows-Desktop
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Prepare Windows
      run: |
        net user runneradmin Password123! /add
        net localgroup administrators runneradmin /add
    - name: Start Tunnel
      run: |
        npm install -g localtunnel
        lt --port 3389
